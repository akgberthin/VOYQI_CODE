# VOYQI Mobility OS — Cloneable Microservice Template
#
# Every execution service (Layer 1) and admin-panel-backing service
# (Layer 2) is generated from this template via
# scripts/generate_service_manifests.py — do not hand-edit generated
# output under kubernetes/base/services/<name>/; edit this template and
# regenerate instead, so all 24 templated services stay structurally
# identical (PRD §4: "identical structural pattern").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  namespace: voyqi
  labels:
    app: __SERVICE_NAME__
    voyqi-layer: "__LAYER__"
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app: __SERVICE_NAME__
  template:
    metadata:
      labels:
        app: __SERVICE_NAME__
        voyqi-layer: "__LAYER__"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      containers:
        - name: __SERVICE_NAME__
          image: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/__SERVICE_NAME__:latest
          ports:
            - containerPort: __PORT__
          env:
            - name: SERVICE_NAME
              value: "__SERVICE_NAME__"
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: __SERVICE_NAME__-config, key: db-connection-name }
          envFrom:
            - secretRef:
                name: __SERVICE_NAME__-secrets # DB creds, service-specific keys
          readinessProbe:
            httpGet: { path: /health, port: __PORT__ }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: __PORT__ }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "125m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(DB_INSTANCE_CONNECTION_NAME)"
          env:
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: __SERVICE_NAME__-config, key: db-connection-name }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  namespace: voyqi
spec:
  selector:
    app: __SERVICE_NAME__
  ports:
    - port: __PORT__
      targetPort: __PORT__
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: __SERVICE_NAME__-hpa
  namespace: voyqi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: __SERVICE_NAME__
  minReplicas: __REPLICAS__
  maxReplicas: __MAX_REPLICAS__
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
