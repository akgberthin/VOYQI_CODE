apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voyqi-gateway-ingress
  namespace: voyqi
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "voyqi-api-ip"
    networking.gke.io/managed-certificates: "voyqi-api-cert"
    networking.gke.io/v1beta1.FrontendConfig: "voyqi-frontend-config"
spec:
  rules:
    - host: api.voyqi.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: voyqi-api-cert
  namespace: voyqi
spec:
  domains:
    - api.voyqi.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: voyqi-frontend-config
  namespace: voyqi
spec:
  redirectToHttps:
    enabled: true
