apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networking/network-policies.yaml
  - gateway/deployment.yaml
  - gateway/ingress.yaml
  - ai-orchestration/deployment.yaml
  - ai-orchestration/tier-policy.yaml
  - mqtt/broker.yaml
  - mqtt/broker-config.yaml # generated from infrastructure/mqtt/
  - services # generated by scripts/generate_service_manifests.py — 24 services

commonLabels:
  app.kubernetes.io/part-of: voyqi-mobility-os
