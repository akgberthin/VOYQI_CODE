# VOYQI Mobility OS — Cloneable Microservice Template
#
# Every execution service (Layer 1) and admin-panel-backing service
# (Layer 2) is generated from this template via
# scripts/generate_service_manifests.py — do not hand-edit generated
# output under kubernetes/base/services/<name>/; edit this template and
# regenerate instead, so all 24 templated services stay structurally
# identical (PRD §4: "identical structural pattern").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-svc
  namespace: voyqi
  labels:
    app: fleet-svc
    voyqi-layer: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-svc
  template:
    metadata:
      labels:
        app: fleet-svc
        voyqi-layer: "1"
    spec:
      serviceAccountName: core-svc-ksa
      containers:
        - name: fleet-svc
          image: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/fleet-svc:latest
          ports:
            - containerPort: 8004
          env:
            - name: SERVICE_NAME
              value: "fleet-svc"
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: fleet-svc-config, key: DB_INSTANCE_CONNECTION_NAME }
          envFrom:
            # Per-environment settings (Kafka bootstrap, Cloud SQL instance),
            # generated into overlays/<env>/service-config.yaml.
            - configMapRef:
                name: fleet-svc-config
            - secretRef:
                name: fleet-svc-secrets # DB creds, service-specific keys — see docs/DEPLOYMENT.md
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "125m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(DB_INSTANCE_CONNECTION_NAME)"
          env:
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: fleet-svc-config, key: DB_INSTANCE_CONNECTION_NAME }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-svc
  namespace: voyqi
spec:
  selector:
    app: fleet-svc
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleet-svc-hpa
  namespace: voyqi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleet-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
