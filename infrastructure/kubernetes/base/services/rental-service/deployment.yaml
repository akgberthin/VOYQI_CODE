# VOYQI Mobility OS — Cloneable Microservice Template
#
# Every execution service (Layer 1) and admin-panel-backing service
# (Layer 2) is generated from this template via
# scripts/generate_service_manifests.py — do not hand-edit generated
# output under kubernetes/base/services/<name>/; edit this template and
# regenerate instead, so all 24 templated services stay structurally
# identical (PRD §4: "identical structural pattern").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-service
  namespace: voyqi
  labels:
    app: rental-service
    voyqi-layer: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rental-service
  template:
    metadata:
      labels:
        app: rental-service
        voyqi-layer: "1"
    spec:
      serviceAccountName: core-svc-ksa
      containers:
        - name: rental-service
          image: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/rental-service:latest
          ports:
            - containerPort: 8005
          env:
            - name: SERVICE_NAME
              value: "rental-service"
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: rental-service-config, key: db-connection-name }
          envFrom:
            - secretRef:
                name: rental-service-secrets # DB creds, service-specific keys
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "125m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(DB_INSTANCE_CONNECTION_NAME)"
          env:
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: rental-service-config, key: db-connection-name }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rental-service
  namespace: voyqi
spec:
  selector:
    app: rental-service
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rental-service-hpa
  namespace: voyqi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rental-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
