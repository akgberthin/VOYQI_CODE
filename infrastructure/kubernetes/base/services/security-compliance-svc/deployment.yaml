# VOYQI Mobility OS — Cloneable Microservice Template
#
# Every execution service (Layer 1) and admin-panel-backing service
# (Layer 2) is generated from this template via
# scripts/generate_service_manifests.py — do not hand-edit generated
# output under kubernetes/base/services/<name>/; edit this template and
# regenerate instead, so all 24 templated services stay structurally
# identical (PRD §4: "identical structural pattern").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-compliance-svc
  namespace: voyqi
  labels:
    app: security-compliance-svc
    voyqi-layer: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-compliance-svc
  template:
    metadata:
      labels:
        app: security-compliance-svc
        voyqi-layer: "2"
    spec:
      serviceAccountName: admin-svc-ksa
      containers:
        - name: security-compliance-svc
          image: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/security-compliance-svc:latest
          ports:
            - containerPort: 8031
          env:
            - name: SERVICE_NAME
              value: "security-compliance-svc"
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: security-compliance-svc-config, key: db-connection-name }
          envFrom:
            - secretRef:
                name: security-compliance-svc-secrets # DB creds, service-specific keys
          readinessProbe:
            httpGet: { path: /health, port: 8031 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8031 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "125m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(DB_INSTANCE_CONNECTION_NAME)"
          env:
            - name: DB_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: security-compliance-svc-config, key: db-connection-name }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: security-compliance-svc
  namespace: voyqi
spec:
  selector:
    app: security-compliance-svc
  ports:
    - port: 8031
      targetPort: 8031
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: security-compliance-svc-hpa
  namespace: voyqi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: security-compliance-svc
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
