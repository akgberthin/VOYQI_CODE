configMapGenerator:
  - name: gateway-config
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=warning

# Production additionally gets PodDisruptionBudgets and stricter resource
# floors across every service — see patches below.
patches:
  - path: workload-identity-patch.yaml
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=voyqi-mobility-os"
