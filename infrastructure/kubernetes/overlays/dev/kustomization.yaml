apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voyqi

resources:
  - ../../base
  - service-config.yaml

namePrefix: ""
nameSuffix: ""

patches:
  - path: workload-identity-patch.yaml
  # Dev runs single replicas of everything to keep the GKE node pool small.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=voyqi-mobility-os"

images:
  - name: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/auth-svc
    newName: us-east4-docker.pkg.dev/voyqi-mobility-dev/voyqi/auth-svc
    newTag: dev
