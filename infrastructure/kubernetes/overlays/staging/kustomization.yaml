apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voyqi

resources:
  - ../../base

images:
  - name: us-east4-docker.pkg.dev/PROJECT_ID/voyqi/api-gateway
    newName: us-east4-docker.pkg.dev/voyqi-mobility-staging/voyqi/api-gateway
    newTag: staging

configMapGenerator:
  - name: gateway-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
