# VOYQI Mobility OS — Service Catalog
# Single source of truth for all 26 microservices. scripts/generate_service_
# manifests.py reads this file and clones _service-template/ into
# kubernetes/base/services/<name>/ for every entry (excluding api-gateway
# and the AI orchestration nucleus (ai-orchestration-realtime,
# ai-orchestration-batch), which are hand-authored — see
# base/gateway/ and base/ai-orchestration/ — because they carry
# platform-specific concerns the generic template doesn't cover: Ingress
# for the gateway, node-pool taints/tolerations/PriorityClass for AI
# orchestration.
#
# service_account values map to the 4 GSAs in terraform/modules/iam.
#
# status values: READY (deployed, tested), ACTIVE_DEV (in progress this
# quarter), PLANNED (scoped, not started). Matches the honest per-service
# build-status discipline used throughout VOYQI documentation — nothing is
# marked READY unless it actually is.

layer_0_platform_infrastructure:
  - name: api-gateway
    port: 8000
    service_account: gateway-ksa
    status: READY
    note: "Hand-authored manifest — see base/gateway/. Sole ingress point."
  - name: auth-service
    port: 8001
    service_account: core-svc-ksa
    status: READY
    note: "JWT (HttpOnly cookie only), MFA, sessions."

