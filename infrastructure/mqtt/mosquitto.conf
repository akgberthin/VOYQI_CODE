# VOYQI telematics broker (Eclipse Mosquitto 2, Phase 1 — EMQX in Phase 2).
#
# Devices connect on 8883 with mutual TLS: each unit holds a client cert
# issued at provisioning with its VIN as the Common Name, and that CN
# becomes its MQTT username, so the ACL below lets a device write only
# under its own VIN. fleet-svc connects on the in-cluster listener 1883
# with a password (NetworkPolicy lets nothing else reach that port).
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/tls.crt
keyfile /mosquitto/tls/tls.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
allow_anonymous false
acl_file /mosquitto/config/acl

listener 1883
password_file /mosquitto/passwords/passwd
allow_anonymous false
acl_file /mosquitto/config/acl
