server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve the gateway (Docker / cluster DNS) instead of pinning the
    # address it had when nginx started — it changes when the gateway is
    # recreated. Set GATEWAY_URL / RESOLVER per environment.
    resolver ${RESOLVER} valid=10s ipv6=off;

    location /api/ {
        set $gateway ${GATEWAY_URL};
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Client-side routes (/ai/agents, /services/fleet-svc, …) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
