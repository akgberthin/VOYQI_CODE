      - "8032:8032"
    environment:
      EXEC_DATABASE_URL: postgresql+asyncpg://executive_svc:${EXECUTIVE_DB_PASSWORD:-devpassword}@executive-db:5432/executive
      EXEC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
