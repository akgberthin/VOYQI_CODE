      - fleet-svc

  dms-db:
    image: postgres:16
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms_svc
      POSTGRES_PASSWORD: ${DMS_DB_PASSWORD:-devpassword}
    volumes:
