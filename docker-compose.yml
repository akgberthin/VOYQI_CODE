    environment:
      HRM_DATABASE_URL: postgresql+asyncpg://hrm_svc:${HRM_DB_PASSWORD:-devpassword}@hrm-db:5432/hrm
      HRM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
