    environment:
      DMS_DATABASE_URL: postgresql+asyncpg://dms_svc:${DMS_DB_PASSWORD:-devpassword}@dms-db:5432/dms
      DMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DMS_AI_ORCHESTRATION_SVC_BASE_URL: http://ai-orchestration-svc:8020
    depends_on:
