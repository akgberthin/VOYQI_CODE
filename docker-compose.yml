    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_svc:${AUTH_DB_PASSWORD:-devpassword}@auth-db:5432/auth
      AUTH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Shared with api-gateway-svc's GATEWAY_JWT_SECRET below — both
      # must match exactly for the gateway to verify tokens statelessly.
      AUTH_JWT_SECRET: ${VOYQI_JWT_SECRET:-local-dev-shared-jwt-secret-change-me}
    depends_on:
      - auth-db
      - kafka

  api-gateway-svc:
    build: ./services/api-gateway-svc
    ports:
      - "8000:8000"
    environment:
      GATEWAY_JWT_SECRET: ${VOYQI_JWT_SECRET:-local-dev-shared-jwt-secret-change-me}
    depends_on:
      - auth-svc

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_svc
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-devpassword}
    volumes:
      - user_db_data:/var/lib/postgresql/data

  user-svc:
    build: ./services/user-svc
    ports:
      - "8025:8025"
    environment:
      USER_DATABASE_URL: postgresql+asyncpg://user_svc:${USER_DB_PASSWORD:-devpassword}@user-db:5432/user_svc
      USER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_AUTH_SVC_BASE_URL: http://auth-svc:8024
    depends_on:
