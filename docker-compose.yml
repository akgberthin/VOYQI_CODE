      - kafka

  # --- Newly delivered by the client (2026-09-29), tested and wired in ---

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_svc
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-devpassword}
    volumes:
