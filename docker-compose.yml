      - kafka
      - auth-svc

  pricing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing_svc
      POSTGRES_PASSWORD: ${PRICING_DB_PASSWORD:-devpassword}
