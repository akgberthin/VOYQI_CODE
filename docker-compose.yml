# Trimmed for local setup: only the services that actually have code.
# The original 14-service compose file referenced identity-svc,
# platform-config-svc, cms-svc, crm-svc and org-svc with no source
# anywhere in the provided zips — they're left out rather than faked.
# ai-orchestration-svc's env vars still point at their URLs so wiring
# them back in later is a one-line uncomment, not a rewrite.
#
# executive-svc was newly built from the 26-service vision
# (docs/SERVICE_INVENTORY.md) — Portfolio Intelligence, tier-1
# reporting/rollups only, no AI agent, no frontend.

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  rbac-db:
    image: postgres:16
    environment:
      POSTGRES_DB: rbac
      POSTGRES_USER: rbac_svc
      POSTGRES_PASSWORD: ${RBAC_DB_PASSWORD:-devpassword}
    volumes:
      - rbac_db_data:/var/lib/postgresql/data

  rbac-svc:
    build: ./services/rbac-svc
    ports:
      - "8011:8011"
    environment:
      RBAC_DATABASE_URL: postgresql+asyncpg://rbac_svc:${RBAC_DB_PASSWORD:-devpassword}@rbac-db:5432/rbac
      RBAC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - rbac-db
      - kafka

  ai-orchestration-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_orchestration
      POSTGRES_USER: ai_orch_svc
      POSTGRES_PASSWORD: ${AI_ORCH_DB_PASSWORD:-devpassword}
    volumes:
      - ai_orchestration_db_data:/var/lib/postgresql/data

  ai-orchestration-svc:
    build: ./services/ai-orchestration-svc
    ports:
      - "8020:8020"
    environment:
      AI_ORCH_DATABASE_URL: postgresql+asyncpg://ai_orch_svc:${AI_ORCH_DB_PASSWORD:-devpassword}@ai-orchestration-db:5432/ai_orchestration
      AI_ORCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_ORCH_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ORCH_ANTHROPIC_MODEL: claude-sonnet-5
      AI_ORCH_RBAC_SVC_BASE_URL: http://rbac-svc:8011
      AI_ORCH_MARKETING_SVC_BASE_URL: http://marketing-svc:8007
      AI_ORCH_FLEET_SVC_BASE_URL: http://fleet-svc:8004
      AI_ORCH_SUBSCRIPTION_SVC_BASE_URL: http://subscription-svc:8003
      AI_ORCH_RENTAL_SVC_BASE_URL: http://rental-svc:8005
      AI_ORCH_DMS_SVC_BASE_URL: http://dms-svc:8008
      AI_ORCH_HUB_SVC_BASE_URL: http://hub-svc:8006
      AI_ORCH_HRM_SVC_BASE_URL: http://hrm-svc:8023
      # Not started in this handoff — left commented so wiring them back in
      # later is a one-line uncomment, not a rewrite:
      # AI_ORCH_IDENTITY_SVC_BASE_URL: http://identity-svc:8014
      # AI_ORCH_CRM_SVC_BASE_URL: http://crm-svc:8021
      # AI_ORCH_ORG_SVC_BASE_URL: http://org-svc:8022
    depends_on:
      - ai-orchestration-db
      - kafka
      - rbac-svc
      - marketing-svc
      - fleet-svc
      - subscription-svc
      - rental-svc
      - dms-svc
      - hub-svc
      - hrm-svc

  marketing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketing
      POSTGRES_USER: marketing_svc
      POSTGRES_PASSWORD: ${MARKETING_DB_PASSWORD:-devpassword}
    volumes:
      - marketing_db_data:/var/lib/postgresql/data

  marketing-svc:
    build: ./services/marketing-svc
    ports:
      - "8007:8007"
    environment:
      MARKETING_DATABASE_URL: postgresql+asyncpg://marketing_svc:${MARKETING_DB_PASSWORD:-devpassword}@marketing-db:5432/marketing
      MARKETING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - marketing-db
      - kafka

  fleet-db:
    image: postgres:16
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet_svc
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:-devpassword}
