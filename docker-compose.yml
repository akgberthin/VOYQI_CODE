  pricing-svc:
    build: ./services/pricing-svc
    ports:
      - "8010:8010"
    environment:
      PRICING_DATABASE_URL: postgresql+asyncpg://pricing_svc:${PRICING_DB_PASSWORD:-devpassword}@pricing-db:5432/pricing
      PRICING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - pricing-db
