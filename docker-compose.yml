# VOYQI Mobility OS — local environment.
# One Postgres per service (database-per-service), one shared Kafka.
# Every service waits for its own database and Kafka to be healthy before
# starting, and restarts on crash. Ports follow docs/PORT_REGISTRY.md
# where they don't collide; see README for the local port map.
#
#   cp .env.example .env && docker compose up -d --build
#   Gateway: http://localhost:8000/health

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Without this the image writes to /tmp/kafka-logs inside the
      # container and the volume below is never used.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # A plain TCP check: the broker accepting connections on 9092. The
      # kafka-broker-api-versions.sh check starts a JVM per probe and times
      # out on a busy laptop, which holds every service back.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 20s

  # Shared cache: gateway rate-limit counters and the access-token
  # revocation list (Memorystore in production).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  # Super admin console (frontend/super-admin): http://localhost:3001
  super-admin:
    build:
      context: ./frontend
      dockerfile: super-admin/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api-gateway-svc:
        condition: service_started

  # Marketing command center (frontend/marketing): http://localhost:3002
  marketing-console:
    build:
      context: ./frontend
      dockerfile: marketing/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      api-gateway-svc:
        condition: service_started

  # Local inbox for development: point the SMTP integration at host
  # "mailpit", port 1025, STARTTLS false — every email the platform sends
  # shows up at http://localhost:8125 instead of reaching real people.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8125:8025"
      - "1025:1025"
  # Telematics broker. Devices publish to voyqi/{tenant}/vehicles/{vin}/...;
  # fleet-svc subscribes. Dev config is anonymous plain TCP — production
  # (mTLS, VIN-scoped ACL) is infrastructure/mqtt/mosquitto.conf.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mqtt/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro

  rbac-db:
    image: postgres:16
    environment:
      POSTGRES_DB: rbac
      POSTGRES_USER: rbac_svc
      POSTGRES_PASSWORD: ${RBAC_DB_PASSWORD:-devpassword}
    volumes:
      - rbac_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rbac-svc:
    build: ./services/rbac-svc
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      # Encrypts integration credentials (super admin → Integrations). Dev-only key; set INTEGRATIONS_KEY elsewhere.
      RBAC_INTEGRATIONS_KEY: ${INTEGRATIONS_KEY:-oBE95Al1TrMdZitl_4RKK07oKgai2R6oHPGNs8Crsok=}
      RBAC_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      RBAC_DATABASE_URL: postgresql+asyncpg://rbac_svc:${RBAC_DB_PASSWORD:-devpassword}@rbac-db:5432/rbac
      RBAC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      rbac-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-orchestration-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_orchestration
      POSTGRES_USER: ai_orch_svc
      POSTGRES_PASSWORD: ${AI_ORCH_DB_PASSWORD:-devpassword}
    volumes:
