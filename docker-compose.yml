    environment:
      RENTAL_DATABASE_URL: postgresql+asyncpg://rental_svc:${RENTAL_DB_PASSWORD:-devpassword}@rental-db:5432/rental
      RENTAL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RENTAL_AI_ORCHESTRATION_SVC_BASE_URL: http://ai-orchestration-svc:8020
      RENTAL_FLEET_SVC_BASE_URL: http://fleet-svc:8004
    depends_on:
      - rental-db
