    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://hub_svc:${HUB_DB_PASSWORD:-devpassword}@hub-db:5432/hub
      HUB_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
