    environment:
      FLEET_DATABASE_URL: postgresql+asyncpg://fleet_svc:${FLEET_DB_PASSWORD:-devpassword}@fleet-db:5432/fleet
      FLEET_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLEET_AI_ORCHESTRATION_SVC_BASE_URL: http://ai-orchestration-svc:8020
    depends_on:
      - fleet-db
