  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification_svc
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-devpassword}
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  notification-svc:
    build: ./services/notification-svc
    ports:
      - "8027:8027"
    environment:
      NOTIF_DATABASE_URL: postgresql+asyncpg://notification_svc:${NOTIFICATION_DB_PASSWORD:-devpassword}@notification-db:5432/notification
      NOTIF_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # No SMTP/SMS provider credentials in this environment — the
      # service falls back to its console provider (logs instead of
      # sending) rather than faking delivery.
    depends_on:
      - notification-db
      - kafka

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-devpassword}
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  payment-svc:
    build: ./services/payment-svc
    ports:
      - "8026:8026"
    environment:
      PAYMENT_DATABASE_URL: postgresql+asyncpg://payment_svc:${PAYMENT_DB_PASSWORD:-devpassword}@payment-db:5432/payment
      PAYMENT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_NOTIFICATION_SVC_BASE_URL: http://notification-svc:8027
      # No Stripe credentials in this environment — falls back to the
      # sandbox provider, clearly marked on every Charge record.
    depends_on:
      - payment-db
      - kafka
      - notification-svc

  crm-db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_svc
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-devpassword}
