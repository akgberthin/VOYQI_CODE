      interval: 5s
      timeout: 5s
      retries: 20

  ai-orchestration-svc:
    build: ./services/ai-orchestration-svc
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      AI_ORCH_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      AI_ORCH_DATABASE_URL: postgresql+asyncpg://ai_orch_svc:${AI_ORCH_DB_PASSWORD:-devpassword}@ai-orchestration-db:5432/ai_orchestration
      AI_ORCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # One container locally, so it runs both the realtime and batch
      # consumer tiers. Kubernetes runs each tier as its own Deployment.
      AI_ORCH_CONSUMER_ROLE: all
      AI_ORCH_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ORCH_ANTHROPIC_MODEL: claude-sonnet-5-5
      AI_ORCH_RBAC_SVC_BASE_URL: http://rbac-svc:8011
      AI_ORCH_MARKETING_SVC_BASE_URL: http://marketing-svc:8007
      AI_ORCH_FLEET_SVC_BASE_URL: http://fleet-svc:8004
      AI_ORCH_SUBSCRIPTION_SVC_BASE_URL: http://subscription-svc:8003
      AI_ORCH_RENTAL_SVC_BASE_URL: http://rental-svc:8005
      AI_ORCH_DMS_SVC_BASE_URL: http://dms-svc:8008
      AI_ORCH_HUB_SVC_BASE_URL: http://hub-svc:8006
      AI_ORCH_HRM_SVC_BASE_URL: http://hrm-svc:8023
      # Break-glass/impersonation sessions live in security-compliance-svc;
      # the ORG origination pipeline lives in originations-svc.
      AI_ORCH_IDENTITY_SVC_BASE_URL: http://security-compliance-svc:8031
      AI_ORCH_CRM_SVC_BASE_URL: http://crm-svc:8021
      AI_ORCH_ORG_SVC_BASE_URL: http://originations-svc:8036
    depends_on:
      ai-orchestration-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rbac-svc:
        condition: service_started
      marketing-svc:
        condition: service_started
      fleet-svc:
        condition: service_started
      subscription-svc:
        condition: service_started
      rental-svc:
        condition: service_started
      dms-svc:
        condition: service_started
      hub-svc:
        condition: service_started
      hrm-svc:
        condition: service_started

