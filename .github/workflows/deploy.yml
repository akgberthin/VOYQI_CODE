name: Deploy

# Manual: builds every service image, pushes it to Artifact Registry, and
# applies the environment's Kafka topics and Kubernetes overlay to GKE.
#
# Needs, per GitHub environment (dev / staging / prod):
#   vars.GCP_PROJECT_ID       e.g. voyqi-mobility-dev
#   vars.GKE_CLUSTER          voyqi-<env> (terraform/modules/gke)
#   secrets.GCP_WIF_PROVIDER  Workload Identity Federation provider
#   secrets.GCP_DEPLOY_SA     service account with Artifact Registry writer
#                             and GKE developer roles
# The GKE control plane only accepts authorized networks
# (terraform authorized_networks): run this on a self-hosted runner inside
# that range, or add the runner's egress range there.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: us-east4-docker.pkg.dev
  REGION: us-east4

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "services=$(ls -d services/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGISTRY" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          # The overlays pull the environment tag (dev / staging / stable);
          # the commit tag keeps every release addressable for rollback.
          tags: |
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/voyqi/${{ matrix.service }}:${{ inputs.environment == 'prod' && 'stable' || inputs.environment }}
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/voyqi/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ env.REGION }}
      - name: Kafka topics first, so no service publishes to a missing topic
        run: kubectl apply -k infrastructure/kubernetes/overlays/${{ inputs.environment }}/kafka
      - name: Platform
        run: kubectl apply -k infrastructure/kubernetes/overlays/${{ inputs.environment }}
      - name: Restart onto the new images and wait
        run: |
          kubectl -n voyqi rollout restart deployment
          for d in $(kubectl -n voyqi get deployment -o name); do
            kubectl -n voyqi rollout status "$d" --timeout=10m
          done
